<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6b86">
<title>Household Status & Channels</title>
<style>
:root{--bg:#f6f1ec;--card:#fffdfa;--text:#2b2220;--mute:#7a6b66;--line:#eadfd8;--accent:#b4456b;--ink:#fff;
--green:#3f9e6a;--red:#d9534f;--amber:#e0a030;--blue:#4a86d6;--purple:#8a62c9;--gray:#a39792;
--shadow:0 1px 2px rgba(60,35,25,.06),0 8px 20px rgba(60,35,25,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#1c1614;--card:#271f1c;--text:#f6ece6;--mute:#b7a59d;--line:#3a2e29;--accent:#e27a9b;--ink:#2b1018;--shadow:none}}
*{box-sizing:border-box}
html{background:var(--page,var(--bg));background-attachment:fixed;min-height:100%;transition:background 0.3s ease}
body{margin:0;color:var(--text);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:28px;line-height:1.15;margin:8px 4px 16px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.label{font-size:15px;color:var(--mute);margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{border:0;background:var(--bg);color:var(--text);border-radius:999px;padding:11px 16px;font-size:15px;font-weight:500;transition:all .15s ease}
.chip.on{font-weight:600}
.chip.sel{box-shadow:0 0 0 2px var(--text) inset}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
input,select{width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.go{margin-top:14px;background:var(--accent);color:var(--ink);border:0;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:600;width:100%;transition:background .2s}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px;border:0;background:var(--bg);color:var(--text);font-weight:600}
.btn-danger{background:#d9534f!important;color:#fff!important}
.person{display:flex;align-items:center;gap:12px;padding:12px 0}
.person+.person{border-top:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;border:3px solid var(--gray);background:var(--bg)}
.pname{font-weight:650;font-size:16px}.pstat{font-size:13px;color:var(--mute)}
.me{font-size:12px;color:var(--accent);margin-left:6px;font-weight:600}
.ask-btn{margin-left:auto;border:0;background:var(--bg);color:var(--accent);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;flex:none}
.ask-btn:disabled{opacity:.55;cursor:default}
.ask{position:sticky;top:10px;z-index:5;background:var(--accent);color:var(--ink);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.ask b{display:block;margin-bottom:12px;font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ask button{border:0;border-radius:14px;padding:11px 15px;font-size:15px;font-weight:600;background:var(--ink);color:var(--accent)}
.ask button.alt{background:transparent;color:var(--ink);border:1.5px solid currentColor}
.reply{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.fi{padding:10px 0}.fi+.fi{border-top:1px solid var(--line)}
.fi small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.note{color:var(--mute);font-size:14px;text-align:center;padding:10px}
.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.link{background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;padding:8px}
.channel-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);border-radius:14px;margin-bottom:8px;cursor:pointer;font-weight:600}
.channel-item:hover{opacity:0.9}
.color-picker-row{display:flex;gap:8px;margin-top:10px}
.color-dot{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.color-dot.selected{border-color:var(--text);transform:scale(1.1)}
.more-btn{width:100%;margin-top:12px;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:14px;padding:10px;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1 id="title">Household Status</h1>

<div id="setupMsg" class="card" hidden>Firebase isn’t set up yet. Paste your Firebase config into <code>index.html</code>.</div>

<!-- CHANNELS SELECTION PAGE -->
<div id="channelSelectScreen" class="card" hidden>
  <div class="label">
    <span>Select Channel</span>
    <button id="editChannelsBtn" class="btn-sm">Edit</button>
  </div>
  <div id="channelsList"><div class="note">Loading channels…</div></div>
  <button id="newChannelBtn" class="go" style="margin-top:10px;">+ Make a New Channel</button>
</div>

<!-- CREATE CHANNEL MODAL / CARD -->
<div id="createChannelCard" class="card" hidden>
  <div class="label">Create Channel</div>
  <input id="newChannelName" placeholder="Channel Name (e.g. Living Room, Office)" maxlength="40">
  <button id="saveChannelBtn" class="go">Create & Join</button>
  <button id="cancelChannelBtn" class="link" style="width:100%;margin-top:8px;">Cancel</button>
</div>

<!-- MAIN APP VIEW -->
<div id="app" hidden>
  <div id="inbox"></div>

  <!-- ADMIN / COLOR SETTINGS -->
  <div id="adminCard" class="card" style="border: 2px dashed var(--accent);">
    <div class="label">
      <span>👑 Admin Theme Control</span>
      <span style="font-size:12px;color:var(--mute);">Live for everyone</span>
    </div>
    <div style="font-size:14px;margin-bottom:8px;">Channel Accent Color:</div>
    <div class="color-picker-row" id="colorPicker"></div>
  </div>

  <div class="card">
    <div class="label">My Status</div>
    <div class="chips" id="chips"></div>
    <input id="noteIn" placeholder="Note (optional), e.g. back at 3pm" maxlength="60">
    <button class="go" id="setBtn">Set Status</button>
  </div>

  <div class="card">
    <div class="label">
      <span>Everyone</span>
      <button id="editPeopleBtn" class="btn-sm">Edit</button>
    </div>
    <div id="list"><div class="note">Loading…</div></div>
  </div>

  <div class="card">
    <div class="label">Recent Changes</div>
    <div id="feed"><div class="note">Loading…</div></div>
    <button id="showMoreFeed" class="more-btn" hidden>Show More (10)</button>
  </div>

  <div class="foot">
    <button class="link" id="sndBtn">Sound on</button>
    <button class="link" id="ntfBtn">Turn on alerts</button>
    <button class="link" id="switchChannel">Switch Channel</button>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyASRTEsWZVTSebZ8p4SCf0onDPDyY2cSjI",
  authDomain: "family-hub-e2995.firebaseapp.com",
  projectId: "family-hub-e2995",
  storageBucket: "family-hub-e2995.firebasestorage.app",
  messagingSenderId: "960242386059",
  appId: "1:960242386059:web:48e1ec58eaf53c6286808e"
};

const $=id=>document.getElementById(id);
const STATUSES=[
 {k:"free",t:"Available",c:"#2fbf8a",fg:"#fff"},{k:"meeting",t:"In a meeting",c:"#b4456b",fg:"#fff"},
 {k:"call",t:"On a call",c:"#f0a020",fg:"#2b1a00"},{k:"off",t:"Off",c:"#2c4a8f",fg:"#fff"}];

const THEME_COLORS = ["#b4456b", "#1f8a63", "#b85f06", "#2c4a8f", "#8a62c9", "#d9534f"];

const S=k=>STATUSES.find(s=>s.k===k)||(k==="out"?STATUSES[3]:{t:"No status",c:"#a39792",fg:"#fff"});
const slug=n=>n.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

let actx;
const unlock=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}};
document.addEventListener("pointerdown",unlock);
const soundOn=()=>get("hs_sound")!=="off";

function chime(){if(!soundOn()||!actx)return;try{[[880,0],[1175,.18],[880,.42]].forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
 g.gain.setValueAtTime(0,actx.currentTime+t);g.gain.linearRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.4);
 o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.45)})}catch(e){}}

function wireFoot(){
  const sb=$("sndBtn"),nb=$("ntfBtn");
  const paint=()=>{sb.textContent=soundOn()?"Sound on":"Sound off"};paint();
  sb.onclick=()=>{put("hs_sound",soundOn()?"off":"on");unlock();paint();if(soundOn())chime()};
  if(!("Notification" in window)||Notification.permission==="granted")nb.hidden=true;
  nb.onclick=()=>{Notification.requestPermission().then(p=>{if(p==="granted")nb.hidden=true})};
}

if(firebaseConfig.apiKey.startsWith("PASTE")){$("setupMsg").hidden=false}
else{
 const db=getFirestore(initializeApp(firebaseConfig));
 let house=get("hs_house"), name=get("hs_name")||"User", me=slug(name), mine={}, knocks=[], first=true, unsubs=[];
 let pending="", editChannelsMode=false, editPeopleMode=false;
 let feedLimit=10, fullFeedList=[];

 const col=c=>collection(db,"houses",house,c);
 const dref=(c,id)=>doc(db,"houses",house,c,id);
 const ago=ts=>{if(!ts)return"";const m=Math.round((Date.now()-ts)/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.round(m/60);return h<24?h+"h ago":Math.round(h/24)+"d ago"};
 const fmt=ts=>{if(!ts)return"";const d=new Date(ts),n=new Date(),t=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  if(d.toDateString()===n.toDateString())return"Today "+t;
  return d.toLocaleDateString([],{month:"short",day:"numeric"})+" "+t};

 const save=patch=>{mine={...mine,...patch,name,updatedAt:Date.now()};setDoc(dref("status",me),mine).catch(()=>{})};
 const post=text=>setDoc(dref("feed",rid("f")),{name,text,at:Date.now()}).catch(()=>{});

 // --- CHANNELS LISTING & MANAGEMENT ---
 function loadChannelsList(){
  onSnapshot(collection(db,"channels"),snap=>{
   const list=$("channelsList");list.textContent="";
   if(snap.empty){
    list.innerHTML='<div class="note">No channels yet. Create one to get started!</div>';
    return;
   }
   snap.docs.forEach(docSnap=>{
    const cData=docSnap.data();
    const item=document.createElement("div");item.className="channel-item";
    const title=document.createElement("span");title.textContent=cData.name||docSnap.id;
    item.appendChild(title);

    if(editChannelsMode){
     const delBtn=document.createElement("button");
     delBtn.className="btn-sm btn-danger";delBtn.textContent="Delete";
     delBtn.onclick=(e)=>{
      e.stopPropagation();
      deleteDoc(doc(db,"channels",docSnap.id)).catch(()=>{});
     };
     item.appendChild(delBtn);
    } else {
     item.onclick=()=>{
      house=docSnap.id;
      put("hs_house",house);
      startApp();
     };
    }
    list.appendChild(item);
   });
  });
 }

 $("editChannelsBtn").onclick=()=>{
  editChannelsMode=!editChannelsMode;
  $("editChannelsBtn").textContent=editChannelsMode?"Done":"Edit";
  loadChannelsList();
 };

 $("newChannelBtn").onclick=()=>{
  $("channelSelectScreen").hidden=true;
  $("createChannelCard").hidden=false;
 };

 $("cancelChannelBtn").onclick=()=>{
  $("createChannelCard").hidden=true;
  $("channelSelectScreen").hidden=false;
 };

 $("saveChannelBtn").onclick=()=>{
  const cName=$("newChannelName").value.trim();
  if(!cName) return;
  const cId=slug(cName);
  setDoc(doc(db,"channels",cId),{name:cName,color:"#b4456b",createdAt:Date.now()}).then(()=>{
   house=cId;
   put("hs_house",house);
   $("createChannelCard").hidden=true;
   startApp();
  });
 };

 // --- ADMIN COLOR PICKER ---
 function setupAdminColors(currentColor){
  const row=$("colorPicker");row.textContent="";
  THEME_COLORS.forEach(color=>{
   const dot=document.createElement("div");
   dot.className="color-dot"+(currentColor===color?" selected":"");
   dot.style.background=color;
   dot.onclick=()=>{
    setDoc(doc(db,"channels",house),{color:color},{merge:true});
   };
   row.appendChild(dot);
  });
 }

 function applyThemeColor(color){
  if(color){
   document.documentElement.style.setProperty("--accent", color);
  }
 }

 // --- RENDER FUNCTIONS ---
 function renderChips(){
  const b=$("chips");b.textContent="";const cur=pending||mine.status||"free";
  STATUSES.forEach(s=>{
   const x=document.createElement("button");const on=(mine.status||"free")===s.k;
   x.className="chip"+(on?" on":"")+(cur===s.k&&!on?" sel":"");x.textContent=s.t;
   if(on||cur===s.k){x.style.background=s.c;x.style.color=s.fg}
   x.onclick=()=>{pending=s.k;renderChips()};b.appendChild(x);
  });
 }

 function renderList(docs){
  const l=$("list");l.textContent="";
  if(!docs.length){l.innerHTML='<div class="note">No one here yet.</div>';return}
  docs.sort((a,b)=>(a.d.name||"").localeCompare(b.d.name||"")).forEach(({id,d})=>{
   const s=S(d.status),r=document.createElement("div");r.className="person";
   const dot=document.createElement("span");dot.className="av";dot.textContent=((d.name||"?").trim()[0]||"?").toUpperCase();dot.style.borderColor=s.c;
   const w=document.createElement("div"),n=document.createElement("div");n.className="pname";n.textContent=d.name||"Someone";
   if(id===me){const m=document.createElement("span");m.className="me";m.textContent="you";n.appendChild(m)}
   const st=document.createElement("div");st.className="pstat";st.textContent=[s.t,d.note,ago(d.updatedAt)].filter(Boolean).join(" · ");
   w.append(n,st);r.append(dot,w);

   if(editPeopleMode){
    const delBtn=document.createElement("button");
    delBtn.className="btn-sm btn-danger";delBtn.style.marginLeft="auto";delBtn.textContent="Remove";
    delBtn.onclick=()=>{ deleteDoc(dref("status",id)).catch(()=>{}); };
    r.appendChild(delBtn);
   } else if(id!==me){
    const b=document.createElement("button");b.className="ask-btn";b.textContent="🔔 Ask";
    b.onclick=()=>{
     b.disabled=true;b.textContent="Asked ✓";
     setDoc(dref("knocks",rid("k")),{to:id,toName:d.name,from:me,fromName:name,at:Date.now(),status:"pending"});
     post("asked "+d.name+" for a moment");
    };
    r.appendChild(b);
   }
   l.appendChild(r);
  });
 }

 $("editPeopleBtn").onclick=()=>{
  editPeopleMode=!editPeopleMode;
  $("editPeopleBtn").textContent=editPeopleMode?"Done":"Edit";
  startApp();
 };

 function renderFeed(){
  const f=$("feed");f.textContent="";
  const items=fullFeedList.slice(0, feedLimit);
  if(!items.length){f.innerHTML='<div class="note">Nothing yet.</div>';return}
  items.forEach(it=>{
   const d=document.createElement("div");d.className="fi";const b=document.createElement("b");b.textContent=it.name||"Someone";
   d.append(b,document.createTextNode(" "+it.text));const s=document.createElement("small");s.textContent=fmt(it.at)+" · "+ago(it.at);d.appendChild(s);f.appendChild(d);
  });

  const moreBtn=$("showMoreFeed");
  if(fullFeedList.length > feedLimit){
   moreBtn.hidden=false;
   moreBtn.textContent=`Show More (${fullFeedList.length - feedLimit} left)`;
  } else {
   moreBtn.hidden=true;
  }
 }

 $("showMoreFeed").onclick=()=>{
  feedLimit+=10;
  renderFeed();
 };

 // --- APP INIT ---
 function startApp(){
  unsubs.forEach(u=>u&&u());unsubs=[];
  $("channelSelectScreen").hidden=true;
  $("app").hidden=false;
  $("title").textContent="Channel: "+house;
  wireFoot();

  // Watch channel meta (color)
  unsubs.push(onSnapshot(doc(db,"channels",house),docSnap=>{
   if(docSnap.exists()){
    const cData=docSnap.data();
    applyThemeColor(cData.color||"#b4456b");
    setupAdminColors(cData.color||"#b4456b");
   }
  }));

  const commit=()=>{
   const st=pending||mine.status||"free",note=$("noteIn").value.trim();
   save({status:st,note});
   post("is now "+S(st).t.toLowerCase()+(note?": “"+note+"”":""));
   pending="";renderChips();
  };
  $("setBtn").onclick=commit;

  unsubs.push(onSnapshot(col("status"),snap=>{
   const lastDocs=snap.docs.map(d=>({id:d.id,d:d.data()}));
   const m=lastDocs.find(x=>x.id===me);
   if(m){mine=m.d} else if(!mine.status){save({status:"free"})}
   renderChips();renderList(lastDocs);
  }));

  unsubs.push(onSnapshot(query(col("feed"),orderBy("at","desc"),limit(100)),snap=>{
   fullFeedList=snap.docs.map(d=>d.data());
   renderFeed();
  }));
 }

 $("switchChannel").onclick=()=>{
  put("hs_house","");
  house="";
  location.reload();
 };

 if(!house){
  $("channelSelectScreen").hidden=false;
  loadChannelsList();
 } else {
  startApp();
 }
}
</script>
</body>
</html>
